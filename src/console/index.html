<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Betlab Evidence Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ec; --muted: #8b93a3; --accent: #4f8cff; --danger: #e5534b;
    --warn: #d99a1b; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  nav a { padding: 6px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; }
  nav a.active, nav a:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
  #whoami { font-size: 12px; color: var(--muted); }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  tr:hover td { background: var(--panel2); }
  input, select, button, textarea { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 13px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.danger { background: var(--danger); border-color: var(--danger); color: white; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; margin: 1px; }
  .badge.high { background: rgba(229,83,75,.2); color: #ff8f88; }
  .badge.warning { background: rgba(217,154,27,.2); color: #f0b93d; }
  .badge.info { background: rgba(79,140,255,.2); color: #8fb6ff; }
  .muted { color: var(--muted); }
  .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  video { width: 100%; background: #000; border-radius: 8px; display: block; }
  .video-wrap { position: relative; }
  .row-highlight {
    position: absolute; border: 2px solid var(--accent); background: rgba(79,140,255,.18);
    border-radius: 3px; pointer-events: none; opacity: 0; transition: opacity .15s ease;
  }
  .row-highlight.show { opacity: 1; }
  .evidence-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .evidence-tabs button.active { background: var(--accent); border-color: var(--accent); color: white; }
  .pano-wrap { position: relative; max-height: 560px; overflow: auto; background: #000; border-radius: 8px; }
  .pano-wrap img { width: 100%; display: block; }
  .pano-highlight { position: absolute; left: 0; width: 100%; border: 2px solid var(--accent); background: rgba(79,140,255,.18); pointer-events: none; opacity: 0; transition: opacity .15s ease; }
  .pano-highlight.show { opacity: 1; }
  tr.partial td { opacity: .6; }
  tr.break-mark td { box-shadow: inset 3px 0 0 var(--danger); }
  .thumb { display: block; width: 150px; height: 34px; background: #000; border-radius: 3px; image-rendering: auto; }
  .quality { padding: 10px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
  .quality.warn { background: rgba(217,154,27,.12); border: 1px solid rgba(217,154,27,.4); }
  .quality.reject { background: rgba(229,83,75,.12); border: 1px solid rgba(229,83,75,.4); }
  .quality.ok { background: rgba(63,185,80,.1); border: 1px solid rgba(63,185,80,.35); }
  .check { font-size: 12px; }
  .check.ok { color: var(--ok); } .check.bad { color: var(--warn); cursor: help; }
  .breaks { margin: 6px 0 0; padding-left: 18px; font-size: 12px; }
  .breaks a { cursor: pointer; }
  .rowlist { max-height: 480px; overflow: auto; }
  .rowlist tr { cursor: pointer; }
  .rowlist tr.active td { background: rgba(79,140,255,.15); }
  .login-box { max-width: 360px; margin: 80px auto; }
  .error { color: var(--danger); }
  .ok-text { color: var(--ok); }
  .small { font-size: 12px; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header id="header" style="display:none">
  <h1>Betlab Archive</h1>
  <nav id="nav"></nav>
  <span id="whoami"></span>
  <button id="logoutBtn">Log out</button>
</header>
<main id="app"></main>

<script>
const API = "";
const state = { token: localStorage.getItem("betlab_token") || "", me: null };

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: "Bearer " + state.token },
  });
  if (res.status === 401) { logout(); throw new Error("unauthorized"); }
  if (!res.ok) {
    let body;
    try { body = await res.json(); } catch { body = { error: res.statusText }; }
    throw new Error(body.error || "request failed");
  }
  const ct = res.headers.get("content-type") || "";
  if (ct.includes("application/json")) return res.json();
  return res;
}

function logout() {
  state.token = ""; state.me = null;
  localStorage.removeItem("betlab_token");
  location.hash = "#/login";
  render();
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtDate(d) { return d ? new Date(d).toLocaleString() : ""; }
function chainSummary(rec) {
  if (rec.chainComplete == null) return '<span class="muted">· balance chain not checkable</span>';
  if (rec.chainComplete) {
    return `· balance chain <span class="ok-text">complete</span> (${Number(rec.chainStart).toFixed(2)} → ${Number(rec.chainEnd).toFixed(2)}, ${rec.newestFirst ? "newest first" : "oldest first"})`;
  }
  const n = Array.isArray(rec.chainBreaks) ? rec.chainBreaks.length : "?";
  return `· balance chain <span class="error">${n} break${n === 1 ? "" : "s"}</span> — rows may be missing or misread`;
}
function flagBadges(flags) {
  if (!flags || !flags.length) return '<span class="muted small">none</span>';
  return flags.map((f) => `<span class="badge ${esc(f.severity)}" title="${esc(f.detail || "")}">${esc(f.code)}</span>`).join(" ");
}

const NAV = [
  ["#/search", "Search"],
  ["#/funding-queue", "Funding queue"],
  ["#/wager-queue", "Wager queue"],
  ["#/participants", "Participants"],
];
const ADMIN_NAV = [["#/staff", "Staff"], ["#/retention", "Retention"]];

function renderHeader() {
  const header = document.getElementById("header");
  const nav = document.getElementById("nav");
  const whoami = document.getElementById("whoami");
  if (!state.me) { header.style.display = "none"; return; }
  header.style.display = "flex";
  const items = state.me.role === "admin" ? [...NAV, ...ADMIN_NAV] : NAV;
  const current = location.hash.split("/")[1] ? "#/" + location.hash.split("/")[1] : "";
  nav.innerHTML = items
    .map(([href, label]) => `<a href="${href}" class="${current === href ? "active" : ""}">${label}</a>`)
    .join("");
  whoami.textContent = `${state.me.name} (${state.me.role})`;
}

document.getElementById("logoutBtn").addEventListener("click", logout);

// ---------- Views ----------

async function viewLogin(root) {
  root.innerHTML = `
    <div class="panel login-box">
      <h2>Sign in</h2>
      <p class="muted small">Paste a staff API token issued by an admin (or the bootstrap STAFF_API_TOKEN).</p>
      <div class="row"><input id="tokenInput" type="password" placeholder="Bearer token" style="flex:1" /></div>
      <div class="row"><button class="primary" id="loginBtn">Sign in</button><span id="loginErr" class="error"></span></div>
    </div>`;
  root.querySelector("#loginBtn").addEventListener("click", async () => {
    const token = root.querySelector("#tokenInput").value.trim();
    if (!token) return;
    state.token = token;
    try {
      const me = await api("/me");
      state.me = me;
      localStorage.setItem("betlab_token", token);
      location.hash = "#/search";
      render();
    } catch (e) {
      root.querySelector("#loginErr").textContent = "Invalid token";
    }
  });
}

async function viewSearch(root) {
  const q = Object.fromEntries(new URLSearchParams(location.hash.split("?")[1] || ""));
  root.innerHTML = `
    <div class="panel">
      <h2>Submissions</h2>
      <div class="row">
        <input id="f-participantId" placeholder="participant id" value="${esc(q.participantId || "")}" />
        <input id="f-casino" placeholder="casino" value="${esc(q.casino || "")}" />
        <input id="f-state" placeholder="enrollment state" value="${esc(q.state || "")}" />
        <input id="f-flag" placeholder="flag code" value="${esc(q.flag || "")}" />
        <button class="primary" id="searchBtn">Search</button>
        <button id="exportBtn">Export CSV</button>
      </div>
      <table>
        <thead><tr><th>Received</th><th>Participant</th><th>Casino</th><th>State</th><th>Kind</th><th>Channel</th><th>Flags</th></tr></thead>
        <tbody id="results"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>`;

  async function run() {
    const params = new URLSearchParams();
    for (const id of ["participantId", "casino", "state", "flag"]) {
      const v = root.querySelector("#f-" + id).value.trim();
      if (v) params.set(id, v);
    }
    location.hash = "#/search?" + params.toString();
    const submissions = await api("/submissions?" + params.toString());
    root.querySelector("#results").innerHTML = submissions.length
      ? submissions
          .map(
            (s) => `<tr onclick="location.hash='#/submission/${s.id}'">
              <td>${fmtDate(s.receivedAt)}</td>
              <td>${esc(s.enrollment.participant.contact || s.enrollment.participant.email || s.enrollment.participant.id.slice(0, 8))}</td>
              <td>${esc(s.enrollment.casino)}</td>
              <td>${esc(s.enrollment.state)}</td>
              <td>${esc(s.kind)}</td>
              <td>${esc(s.channel)}</td>
              <td>${flagBadges(s.integrityFlags)}</td>
            </tr>`,
          )
          .join("")
      : `<tr><td colspan="7" class="muted">No submissions match.</td></tr>`;
  }

  root.querySelector("#searchBtn").addEventListener("click", run);
  root.querySelector("#exportBtn").addEventListener("click", async () => {
    const params = new URLSearchParams();
    for (const id of ["participantId", "casino", "state", "flag"]) {
      const v = root.querySelector("#f-" + id).value.trim();
      if (v) params.set(id, v);
    }
    const res = await api("/exports/submissions.csv?" + params.toString());
    const blob = await res.blob();
    downloadBlob(blob, "submissions.csv");
  });

  await run();
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// The core review view (PRD §6.4): extracted rows beside the raw recording,
// clicking a row seeks the player to the frame it was read from.
async function viewSubmission(root, id) {
  root.innerHTML = `<div class="panel"><span class="muted">Loading…</span></div>`;
  const s = await api("/submissions/" + id);
  const run = s.extractionRuns[0];
  const isVideo = /video|mp4|quicktime/.test(s.mediaAsset.mime || "") || s.kind === "wager_recording";

  root.innerHTML = `
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div>
          <h2 style="margin:0">Submission <code>${esc(id.slice(0, 8))}</code></h2>
          <div class="small muted">
            <a href="#/participant/${s.enrollment.participant.id}">${esc(s.enrollment.participant.contact || s.enrollment.participant.email || s.enrollment.participant.id)}</a>
            · ${esc(s.enrollment.casino)} · enrollment state <code>${esc(s.enrollment.state)}</code> · ${esc(s.kind)} via ${esc(s.channel)}
          </div>
        </div>
        <div>${flagBadges(s.integrityFlags)}</div>
      </div>
    </div>
    ${s.mediaAsset.deletedAt
      ? `<div class="panel error">Raw media was purged under the retention policy on ${fmtDate(s.mediaAsset.deletedAt)}. Structured data below is still intact.</div>`
      : ""}
    ${s.emailEvidence
      ? `<div class="panel">
          <h3>Email evidence</h3>
          <table>
            <tr><th>Tier</th><td>${esc(s.emailEvidence.tier)}</td><th>DKIM</th><td>${esc(s.emailEvidence.dkimResult)}</td></tr>
            <tr><th>Signer</th><td>${esc(s.emailEvidence.dDomain || "—")}</td><th>Selector</th><td>${esc(s.emailEvidence.selector || "—")}</td></tr>
            <tr><th>h= covers To</th><td>${s.emailEvidence.hTagCoversTo}</td><th>l= present</th><td>${s.emailEvidence.lTagPresent}</td></tr>
            <tr><th>From</th><td>${esc(s.emailEvidence.fromAddr || "—")}</td><th>To</th><td>${esc(s.emailEvidence.toAddr || "—")}</td></tr>
          </table>
        </div>`
      : ""}
    <div class="review-grid">
      <div class="panel">
        <h3>Raw evidence</h3>
        ${
          s.mediaAsset.deletedAt
            ? '<p class="muted">Purged.</p>'
            : isVideo
              ? `${run && run.panoramaBlobKey ? '<div class="evidence-tabs"><button id="tabPano" class="active">Stitched list</button><button id="tabVideo">Recording</button></div>' : ""}
                 <div id="panoView" class="pano-wrap" ${run && run.panoramaBlobKey ? "" : "hidden"}><img id="panoImg" alt="stitched transaction list" /><div id="panoHighlight" class="pano-highlight"></div></div>
                 <div id="videoView" class="video-wrap" ${run && run.panoramaBlobKey ? "hidden" : ""}><video id="player" controls></video><div id="rowHighlight" class="row-highlight"></div></div>`
              : '<div id="mediaHolder" class="muted">Loading…</div>'
        }
      </div>
      <div class="panel">
        <h3>Extracted rows ${run ? `<span class="small muted">(run ${fmtDate(run.startedAt)}, <span id="runStatus">${esc(run.status)}</span>${run.costUsd != null ? ", $" + Number(run.costUsd).toFixed(4) : ""}${run.frameCount != null ? `, ${run.frameCount} frames → ${run.tileCount} tile${run.tileCount === 1 ? "" : "s"}` : ""}${run.retryTiles ? `, ${run.retryTiles} re-read` : ""}${run.crossCheckModel ? `, cross-checked by ${esc(run.crossCheckModel)}` : ""})</span>` : ""}</h3>
        ${run && (run.status === "pending" || run.status === "running") ? `<p class="small muted" id="runProgress">Extracting… this takes a minute or two (reconstructing the scroll, then reading it). This page updates itself.</p>` : ""}
        ${run && run.quality ? qualityBox(run.quality, run) : ""}
        ${
          run && run.reconciliation
            ? `<p class="small">Wagered <b>${Number(run.reconciliation.wageredTotal).toFixed(2)}</b>
               ${run.reconciliation.grantedAmount != null ? `vs granted <b>${Number(run.reconciliation.grantedAmount).toFixed(2)}</b>` : ""}
               — arithmetic ${run.reconciliation.arithmeticOk ? '<span class="ok-text">ok</span>' : '<span class="error">mismatch</span>'}
               ${chainSummary(run.reconciliation)}</p>
               ${breakList(run.reconciliation)}`
            : ""
        }
        <div class="rowlist">
          <table>
            <thead><tr><th>#</th><th>Read from</th><th>Timestamp</th><th>Type</th><th>Description</th><th>Amount</th><th>Balance (before→after)</th><th>Check</th></tr></thead>
            <tbody id="rowsBody">
              ${
                run && run.rows.length
                  ? run.rows
                      .map((r, i) => {
                        const before = r.balanceBefore != null ? Number(r.balanceBefore).toFixed(2) : null;
                        const after = r.balanceAfter != null ? Number(r.balanceAfter).toFixed(2) : "—";
                        const balanceCell = before ? `${before} → ${after}` : after;
                        const hasBox = [r.boxX, r.boxY, r.boxW, r.boxH].every((v) => v != null);
                        const boxAttrs = hasBox
                          ? ` data-box-x="${r.boxX}" data-box-y="${r.boxY}" data-box-w="${r.boxW}" data-box-h="${r.boxH}"`
                          : "";
                        const panoAttrs = r.panoramaTop != null ? ` data-pano-top="${r.panoramaTop}" data-pano-bottom="${r.panoramaBottom}"` : "";
                        const check = r.crossChecked
                          ? r.disagreements && r.disagreements.length
                            ? `<span class="check bad" title="second read disagreed on: ${esc(r.disagreements.join(", "))}">⚠ ${esc(r.disagreements.join(", "))}</span>`
                            : '<span class="check ok" title="second read agreed">✓</span>'
                          : '<span class="check muted" title="not cross-checked">—</span>';
                        return `<tr data-t="${r.sourceFrameTs ?? ""}"${boxAttrs}${panoAttrs} id="row-${i}" class="${r.partial ? "partial" : ""}" title="${r.partial ? "cut off at the edge of the recording — partial read" : ""}">
                          <td class="small muted">${i}</td>
                          <td><canvas class="thumb" data-thumb-top="${r.panoramaTop ?? ""}" data-thumb-bottom="${r.panoramaBottom ?? ""}" width="300" height="68"></canvas></td>
                          <td>${esc(r.timestamp ? fmtDate(r.timestamp) : "—")}</td>
                          <td>${esc(r.type || "—")}</td>
                          <td class="small muted">${esc(r.description || "—")}</td>
                          <td>${r.amount != null ? Number(r.amount).toFixed(2) : "—"}</td>
                          <td>${balanceCell}</td>
                          <td>${check}</td>
                        </tr>`;
                      })
                      .join("")
                  : `<tr><td colspan="8" class="muted">${run && (run.status === "pending" || run.status === "running") ? "Extracting…" : run && run.quality && run.quality.verdict === "reject" ? "Not read — recording rejected (see above)." : "No extraction run yet."}</td></tr>`
              }
            </tbody>
          </table>
        </div>
        <div class="row">
          <button id="extractBtn">${run ? "Re-run extraction" : "Run extraction"}</button>
          ${run && run.status === "succeeded" ? `<button id="pdfBtn">Export evidence PDF</button>` : ""}
          <button id="sheetBtn" title="Export this enrollment to a spreadsheet and open this recording's tab">Open in Sheets</button>
          ${run && run.quality && run.quality.verdict === "reject" ? `<button id="forceBtn" class="danger" title="Read the recording despite the quality verdict">Extract anyway</button>` : ""}
        </div>
      </div>
    </div>
    <div class="panel">
      <h3>Integrity flags</h3>
      <table>
        <thead><tr><th>Code</th><th>Severity</th><th>Detail</th><th>Source</th></tr></thead>
        <tbody>
          ${
            s.integrityFlags.length
              ? s.integrityFlags
                  .map((f) => `<tr><td><span class="badge ${esc(f.severity)}">${esc(f.code)}</span></td><td>${esc(f.severity)}</td><td class="small">${esc(f.detail || "")}</td><td class="small muted">${esc(f.generatedBy)}</td></tr>`)
                  .join("")
              : `<tr><td colspan="4" class="muted">None.</td></tr>`
          }
        </tbody>
      </table>
    </div>`;

  if (!s.mediaAsset.deletedAt) {
    const res = await api(`/submissions/${id}/media`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if (isVideo) {
      root.querySelector("#player").src = url;
      if (run && run.panoramaBlobKey) {
        const pres = await api(`/submissions/${id}/extraction-runs/${run.id}/panorama`);
        root.querySelector("#panoImg").src = URL.createObjectURL(await pres.blob());
      }
    } else {
      const holder = root.querySelector("#mediaHolder");
      if (holder) holder.innerHTML = `<img src="${url}" style="max-width:100%;border-radius:8px" />`;
    }
  }

  const tabPano = root.querySelector("#tabPano");
  const tabVideo = root.querySelector("#tabVideo");
  if (tabPano && tabVideo) {
    const show = (which) => {
      root.querySelector("#panoView").hidden = which !== "pano";
      root.querySelector("#videoView").hidden = which !== "video";
      tabPano.classList.toggle("active", which === "pano");
      tabVideo.classList.toggle("active", which === "video");
    };
    tabPano.addEventListener("click", () => show("pano"));
    tabVideo.addEventListener("click", () => show("video"));
  }

  root.querySelectorAll("#rowsBody tr[data-t]").forEach((tr) => {
    tr.addEventListener("click", () => {
      root.querySelectorAll("#rowsBody tr").forEach((x) => x.classList.remove("active"));
      tr.classList.add("active");
      const player = root.querySelector("#player");
      if (player && tr.dataset.t) {
        player.currentTime = parseFloat(tr.dataset.t);
        player.pause();
      }
      const panoImg = root.querySelector("#panoImg");
      const panoHl = root.querySelector("#panoHighlight");
      if (panoImg && panoHl && tr.dataset.panoTop != null && panoImg.naturalHeight) {
        const k = panoImg.clientWidth / panoImg.naturalWidth;
        const top = Number(tr.dataset.panoTop) * k;
        const h = (Number(tr.dataset.panoBottom) - Number(tr.dataset.panoTop)) * k;
        panoHl.style.top = top + "px";
        panoHl.style.height = h + "px";
        panoHl.classList.add("show");
        const wrap = root.querySelector("#panoView");
        wrap.scrollTop = Math.max(0, top - wrap.clientHeight / 2 + h / 2);
      }
      const highlight = root.querySelector("#rowHighlight");
      if (highlight) {
        if (tr.dataset.boxX != null) {
          highlight.style.left = Number(tr.dataset.boxX) * 100 + "%";
          highlight.style.top = Number(tr.dataset.boxY) * 100 + "%";
          highlight.style.width = Number(tr.dataset.boxW) * 100 + "%";
          highlight.style.height = Number(tr.dataset.boxH) * 100 + "%";
          highlight.classList.add("show");
        } else {
          highlight.classList.remove("show");
        }
      }
    });
  });

  const trigger = async (btn, force) => {
    btn.disabled = true; btn.textContent = "Queued…";
    try {
      await api(`/submissions/${id}/extract${force ? "?force=true" : ""}`, { method: "POST" });
      viewSubmission(root, id);
    } catch (e) {
      alert("Extraction failed to start: " + e.message);
      btn.disabled = false;
    }
  };
  const extractBtn = root.querySelector("#extractBtn");
  if (extractBtn) extractBtn.addEventListener("click", () => trigger(extractBtn, false));
  const forceBtn = root.querySelector("#forceBtn");
  if (forceBtn) forceBtn.addEventListener("click", () => trigger(forceBtn, true));
  const sheetBtn = root.querySelector("#sheetBtn");
  if (sheetBtn) sheetBtn.addEventListener("click", () => exportSheet(sheetBtn, s.enrollment.id, id));

  const pdfBtn = root.querySelector("#pdfBtn");
  if (pdfBtn) pdfBtn.addEventListener("click", async () => {
    pdfBtn.disabled = true;
    try {
      const res = await api(`/submissions/${id}/extraction-runs/${run.id}/evidence.pdf`);
      downloadBlob(await res.blob(), `evidence-${id.slice(0, 8)}.pdf`);
    } catch (e) { alert("Export failed: " + e.message); } finally { pdfBtn.disabled = false; }
  });

  // Row thumbnails: the exact band each row was read from, cut from the
  // panorama already loaded above — no extra requests.
  const panoImgEl = root.querySelector("#panoImg");
  if (panoImgEl) {
    const draw = () => {
      root.querySelectorAll("canvas.thumb").forEach((c) => {
        const top = Number(c.dataset.thumbTop), bottom = Number(c.dataset.thumbBottom);
        if (!c.dataset.thumbTop || !(bottom > top)) return;
        const ctx = c.getContext("2d");
        const h = bottom - top;
        const scale = c.width / panoImgEl.naturalWidth;
        c.height = Math.max(24, Math.round(h * scale));
        ctx.drawImage(panoImgEl, 0, top, panoImgEl.naturalWidth, h, 0, 0, c.width, c.height);
      });
    };
    if (panoImgEl.complete && panoImgEl.naturalWidth) draw(); else panoImgEl.addEventListener("load", draw);
  }

  // Chain breaks: click to jump to the rows on either side.
  root.querySelectorAll("[data-break-row]").forEach((a) => {
    a.addEventListener("click", () => {
      const i = Number(a.dataset.breakRow);
      root.querySelectorAll("#rowsBody tr").forEach((x) => x.classList.remove("break-mark", "active"));
      for (const k of [i - 1, i]) {
        const tr = root.querySelector(`#row-${k}`);
        if (tr) tr.classList.add("break-mark");
      }
      const target = root.querySelector(`#row-${i}`);
      if (target) { target.scrollIntoView({ block: "center" }); target.click(); }
    });
  });

  // A queued/running extraction: poll until it settles, then re-render.
  if (run && (run.status === "pending" || run.status === "running")) {
    const poll = async () => {
      if (!document.contains(root) || !location.hash.includes(id)) return;
      try {
        const latest = await api(`/extraction-runs/${run.id}`);
        if (latest.status === "pending" || latest.status === "running") {
          const st = root.querySelector("#runStatus"); if (st) st.textContent = latest.status;
          setTimeout(poll, 3000);
        } else {
          viewSubmission(root, id);
        }
      } catch { setTimeout(poll, 5000); }
    };
    setTimeout(poll, 3000);
  }
}

/**
 * Export the enrollment's workbook and open it. The export is idempotent —
 * the same enrollment always updates the same spreadsheet — so the button is
 * safe to press repeatedly, and after a re-extraction it refreshes the data.
 * A popup blocker would eat window.open() after the await, so the tab is
 * claimed first and pointed at the URL when it arrives.
 */
async function exportSheet(btn, enrollmentId, submissionId) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Exporting…";
  const tab = window.open("", "_blank");
  try {
    const q = submissionId ? `?submissionId=${encodeURIComponent(submissionId)}` : "";
    const res = await api(`/enrollments/${enrollmentId}/sheet${q}`, { method: "POST" });
    if (tab) tab.location = res.url; else location.href = res.url;
  } catch (e) {
    if (tab) tab.close();
    alert("Sheet export failed: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

function qualityBox(q, run) {
  const label = q.verdict === "reject" ? "Recording rejected" : q.verdict === "warn" ? "Recording quality" : "Recording quality: good";
  const m = q.metrics || {};
  const facts = [
    m.durationSeconds != null ? `${Number(m.durationSeconds).toFixed(1)}s` : null,
    m.rowBands != null ? `${m.rowBands} row bands` : null,
    m.segments != null ? `${m.segments} segment${m.segments === 1 ? "" : "s"}` : null,
    m.untrustedFrames != null && m.frameCount ? `${Math.round(100 * m.untrustedFrames / m.frameCount)}% frames skipped` : null,
    m.noiseFloor != null ? `noise ${Number(m.noiseFloor).toFixed(1)}` : null,
  ].filter(Boolean).join(" · ");
  return `<div class="quality ${esc(q.verdict)}"><b>${label}</b>${q.reasons && q.reasons.length ? "<ul class='breaks'>" + q.reasons.map((r) => `<li>${esc(r)}</li>`).join("") + "</ul>" : ""}<div class="small muted">${esc(facts)}</div></div>`;
}

function breakList(rec) {
  const breaks = Array.isArray(rec.chainBreaks) ? rec.chainBreaks : [];
  if (!breaks.length) return "";
  return `<ul class="breaks">${breaks.map((b) => `<li><a data-break-row="${b.rowIndex}">row ${b.rowIndex}</a> — ${esc(b.detail)}</li>`).join("")}</ul>`;
}

      </table>
    </div>`;
  async function load() {

    root.querySelector("#pbody").innerHTML = list

async function viewParticipant(root, id) {
  const p = await api("/participants/" + id);
  root.innerHTML = `
    <div class="panel">
      <h2>${esc(p.contact || p.email || p.id)}</h2>
      <p class="small muted">Registered email: ${esc(p.email || "—")} · Created ${fmtDate(p.createdAt)}</p>
      <div class="row"><input id="newCasino" placeholder="casino name" /><button class="primary" id="newEnrollBtn">New enrollment</button></div>
    </div>
    ${p.enrollments
      .map(
        (e) => `<div class="panel">
        <div class="row" style="justify-content:space-between">
          <h3 style="margin:0">${esc(e.casino)} — <code>${esc(e.state)}</code></h3>
          <div>
            <button onclick="fileRequestFor('${e.id}')">Create file request</button>
            <button class="sheet-btn" data-enrollment="${e.id}">${e.sheetUrl ? "Update spreadsheet" : "Export to Sheets"}</button>
          </div>
        </div>
        ${e.grant ? `<p class="small">Granted ${Number(e.grant.amount).toFixed(2)} on ${fmtDate(e.grant.sentAt)} via ${esc(e.grant.method || "—")}</p>` : ""}
        <div class="small" id="ledger-${e.id}"><span class="muted">Loading ledger…</span></div>
        <table>
          <thead><tr><th>Received</th><th>Kind</th><th>Channel</th><th>Flags</th></tr></thead>
          <tbody>
            ${e.submissions
              .map((s) => `<tr onclick="location.hash='#/submission/${s.id}'"><td>${fmtDate(s.receivedAt)}</td><td>${esc(s.kind)}</td><td>${esc(s.channel)}</td><td>${flagBadges(s.integrityFlags)}</td></tr>`)
              .join("") || `<tr><td colspan="4" class="muted">No submissions yet.</td></tr>`}
          </tbody>
        </table>
      </div>`,
      )
      .join("")}`;

  root.querySelectorAll(".sheet-btn").forEach((btn) => {
    btn.addEventListener("click", () => exportSheet(btn, btn.dataset.enrollment, null));
  });

  // Combined ledger across every clip of each enrollment.
  for (const e of p.enrollments) {
    const holder = root.querySelector(`#ledger-${CSS.escape(e.id)}`);
    if (!holder) continue;
    api(`/enrollments/${e.id}/ledger`).then((l) => {
      if (!l.clips.length) { holder.innerHTML = '<span class="muted">No extracted recordings yet.</span>'; return; }
      const chain = l.chain.checkedRows === 0
        ? '<span class="muted">chain not checkable</span>'
        : l.chain.complete
          ? `<span class="ok-text">chain complete</span> (${Number(l.chain.startBalance).toFixed(2)} → ${Number(l.chain.endBalance).toFixed(2)})`
          : `<span class="error">${l.chain.breaks.length} break${l.chain.breaks.length === 1 ? "" : "s"}</span>${l.betweenClips ? `, ${l.betweenClips} between clips` : ""}`;
      holder.innerHTML = `<b>Ledger:</b> ${l.rows.length} rows across ${l.clips.length} clip${l.clips.length === 1 ? "" : "s"} · wagered <b>${Number(l.wageredTotal).toFixed(2)}</b> · ${chain}
        <span class="muted">· clips: ${l.clips.map((c) => `<a href="#/submission/${c.submissionId}">${esc(c.submissionId.slice(0, 8))}</a> (${c.rows} rows${c.chainStart != null ? `, ${Number(c.chainStart).toFixed(2)}→${Number(c.chainEnd).toFixed(2)}` : ""})`).join(", ")}</span>`;
    }).catch((err) => { holder.innerHTML = `<span class="error">${esc(err.message)}</span>`; });
  }

  root.querySelector("#newEnrollBtn").addEventListener("click", async () => {
    const casino = root.querySelector("#newCasino").value.trim();
    if (!casino) return;
    await api(`/participants/${id}/enrollments`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ casino }) });
    viewParticipant(root, id);
  });
}

  const list = await api("/enrollments/funding-queue");
  root.querySelector("#body").innerHTML = list.length

window.fundEnrollment = async (id) => {
  const amount = prompt("Grant amount (leave blank to skip recording a grant now):");
  const note = prompt("Note for the decision record:") || "";
  const body = { note };
  if (amount) body.grant = { amount: Number(amount), sentAt: new Date().toISOString() };
  try {
    await api(`/enrollments/${id}/fund`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    render();
  } catch (e) {
    alert("Failed: " + e.message);
  }
};

async function viewRetention(root) {
  const settings = await api("/retention-settings");
  root.innerHTML = `
    <div class="panel">
      <h2>Retention policy</h2>
      <p class="small muted">PRD §9 — raw media is deleted after the window below; structured/extracted data and decision records are kept indefinitely regardless.</p>
      <div class="row">
        <label>Raw media (days) <input id="raw" type="number" value="${settings.rawMediaRetentionDays}" style="width:80px" /></label>
        <label>Funded signup-email evidence (days) <input id="funded" type="number" value="${settings.fundedEmailEvidenceRetentionDays}" style="width:80px" /></label>
        <button class="primary" id="saveBtn">Save</button>
        <button id="runBtn">Run now</button>
      </div>
      <div id="msg" class="small"></div>
    </div>`;
  root.querySelector("#saveBtn").addEventListener("click", async () => {
    await api("/retention-settings", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        rawMediaRetentionDays: Number(root.querySelector("#raw").value),
        fundedEmailEvidenceRetentionDays: Number(root.querySelector("#funded").value),
      }),
    });
    root.querySelector("#msg").innerHTML = '<span class="ok-text">Saved.</span>';
  });
  root.querySelector("#runBtn").addEventListener("click", async () => {
    const result = await api("/retention/run", { method: "POST" });
    root.querySelector("#msg").textContent = `Deleted ${result.deleted}, skipped ${result.skipped}.`;
  });
}

// ---------- Router ----------

async function render() {
  const root = document.getElementById("app");
  const hash = location.hash || "#/search";
  const [path, id] = hash.replace("#/", "").split("?")[0].split("/");

  if (!state.token) { renderHeader(); return viewLogin(root); }
  if (!state.me) {
    try { state.me = await api("/me"); } catch { return; }
  }
  renderHeader();

  try {
    if (path === "login") return viewLogin(root);
    if (path === "search" || path === "") return viewSearch(root);
    if (path === "submission" && id) return viewSubmission(root, id);
    if (path === "participants") return viewParticipants(root);
    if (path === "participant" && id) return viewParticipant(root, id);
    if (path === "funding-queue") return viewFundingQueue(root);
    if (path === "wager-queue") return viewWagerQueue(root);
    if (path === "staff") return viewStaff(root);
    if (path === "retention") return viewRetention(root);
    root.innerHTML = `<div class="panel">Not found.</div>`;
  } catch (e) {
    root.innerHTML = `<div class="panel error">Error: ${esc(e.message)}</div>`;
  }
}

window.addEventListener("hashchange", render);
render();
</script>
